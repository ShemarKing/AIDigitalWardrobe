<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Digital Wardrobe · 产品原型交互稿 v2</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#ECE9E3; --app:#F5F3EF; --card:#FFFFFF; --ink:#1C1B1A; --sub:#7A7570;
  --line:#EAE5DE; --accent:#E2603F; --accent-soft:#FBE9E3; --ok:#3E8E6E; --warn:#C98A2B;
  --radius:18px; --shadow:0 10px 30px rgba(40,34,28,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.stage{display:flex;gap:36px;align-items:center}
.phone{width:390px;height:812px;background:var(--app);border-radius:42px;box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column;border:10px solid #161514}
.statusbar{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;color:var(--ink)}
.statusbar .icons{display:flex;gap:6px;font-size:12px}
#view{flex:1;overflow-y:auto;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
/* ---------- Tab Bar ---------- */
.tabbar{flex:none;height:74px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:14px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub);cursor:pointer;padding-top:10px}
.tab .ticon{font-size:21px;filter:grayscale(.4)}
.tab.active{color:var(--accent)}
.tab.active .ticon{filter:none}
/* ----------通用 ---------- */
.page{padding:18px 18px 28px}
.pagetitle{font-size:23px;font-weight:700;letter-spacing:.3px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 2px 10px rgba(40,34,28,.05)}
.btn{border:none;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:var(--app);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.scroll-x{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.scroll-x::-webkit-scrollbar{display:none}
.tag{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--app);color:var(--sub)}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
/* 衣物缩略图 */
.item-img{width:100%;aspect-ratio:1/1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:38px}
/* ---------- Today ---------- */
.hero{background:linear-gradient(135deg,#2B2A28,#4A4640);color:#fff;border-radius:22px;padding:18px}
.hero .date{font-size:13px;opacity:.8}
.hero .temp{font-size:30px;font-weight:700;margin:4px 0}
.hero .meta{font-size:12px;opacity:.85;display:flex;gap:14px;flex-wrap:wrap}
.hero .src{font-size:10px;opacity:.6;margin-top:8px}
.outfit{margin-top:16px}
.outfit .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.outfit .score-note{font-size:12px;color:var(--sub)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:var(--card);border-radius:16px;padding:10px;text-align:center}
.slot .label{font-size:10px;color:var(--sub);margin-bottom:6px}
.slot .item-img{font-size:30px;border-radius:12px}
.slot .nm{font-size:11px;margin-top:6px;line-height:1.3}
.reason{font-size:12.5px;line-height:1.6;margin-top:12px;color:#3A3733}
.warn{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--warn);margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px}
.act{flex:1;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 0;font-size:12px;cursor:pointer;color:var(--sub);text-align:center}
.act.on-like{color:var(--ok);border-color:var(--ok);background:#EDF6F1}
.act.on-dis{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.act.on-fav{color:var(--warn);border-color:var(--warn);background:#FBF3E6}
/* ---------- Wardrobe ---------- */
.search{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:11px 14px;margin:14px 0}
.search input{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;background:transparent}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.gitem{background:var(--card);border-radius:16px;padding:10px;cursor:pointer}
.gitem .nm{font-size:11px;margin-top:7px;line-height:1.3}
.gitem .ct{font-size:10px;color:var(--sub)}
.fab{position:absolute;right:18px;bottom:92px;width:56px;height:56px;border-radius:18px;background:var(--ink);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:var(--shadow);z-index:5}
/* ---------- Sheet 弹层 ---------- */
.mask{position:absolute;inset:0;background:rgba(20,18,16,.42);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--app);border-radius:26px 26px 0 0;max-height:82%;overflow-y:auto;padding:8px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
/* 表单 */
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--sub);display:block;margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;background:var(--card);outline:none}
.conf{font-size:10px;color:var(--sub);margin-left:6px}
/* ---------- Stylist ---------- */
.chat{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.bubble{max-width:80%;padding:12px 14px;border-radius:18px;font-size:13.5px;line-height:1.6}
.bubble.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.mini-outfit{margin-top:10px;display:flex;gap:8px}
.mini-outfit .slot{flex:1;padding:6px}
.mini-outfit .item-img{font-size:22px}
.mini-outfit .nm{font-size:10px}
.mini-link{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:11px;color:var(--accent);cursor:pointer}
.composer{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 18px;background:var(--app)}
.composer input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px;outline:none;font-family:inherit}
/* ---------- Outfits ---------- */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:14px 0}
.seg button{flex:1;border:none;background:transparent;padding:9px 0;font-size:13px;border-radius:11px;cursor:pointer;color:var(--sub);font-family:inherit}
.seg button.on{background:var(--ink);color:#fff}
.timeline-item{display:flex;gap:12px;margin-bottom:14px}
.timeline-item .thumb{width:64px;height:64px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.thumb.model{width:52px;height:68px;padding:0;overflow:hidden;background:linear-gradient(180deg,#F1EFEA,#E4E1DA)}
.thumb.model svg{display:block;width:100%;height:100%}
/* ---------- Profile / Insights ---------- */
.ring{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:conic-gradient(var(--accent) 72%,var(--line) 0)}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-row .nm{width:88px;font-size:12px}
.bar-row .track{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:6px;background:var(--accent)}
.bar-row .val{width:34px;text-align:right;font-size:11px;color:var(--sub)}
.color-dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.pref-tag{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12px;margin:0 8px 8px 0}
.pref-tag .x{cursor:pointer;color:var(--sub)}
.insight-card{border-left:3px solid var(--accent);padding-left:12px;margin:12px 0}
.insight-card h4{font-size:13.5px;margin-bottom:4px}
.insight-card p{font-size:12px;color:var(--sub);line-height:1.6}
.empty{text-align:center;padding:60px 24px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:12px}
.skel{border-radius:14px;background:linear-gradient(90deg,#eee 25%,#f7f5f1 37%,#eee 63%);background-size:400% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:10px 16px;border-radius:12px;z-index:40;opacity:0;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
/* ---------- 整套 Look 模特预览 ---------- */
.look-top{display:flex;align-items:center;gap:10px;padding:4px 0 2px}
.back-chip{width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex:none;padding-bottom:2px}
.look-top .lt-title{flex:1;min-width:0}
.look-top .lt-title strong{font-size:16px;display:block}
.look-top .lt-title span{font-size:11px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.fav-chip{width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex:none;color:var(--sub)}
.fav-chip.on{background:#FBF3E6;border-color:var(--warn);color:var(--warn)}
.look-stage{position:relative;margin:12px 0 0;height:460px;border-radius:22px;background:linear-gradient(180deg,#F1EFEA,#E4E1DA);overflow:hidden;transition:height .28s ease}
.look-stage.picking{height:320px}
.look-stage>svg{display:block;width:100%;height:100%}
.look-cap{position:absolute;left:12px;top:12px;z-index:2;font-size:10px;color:var(--sub);background:rgba(255,255,255,.72);border-radius:8px;padding:4px 9px}
.gender-switch{position:absolute;right:12px;top:12px;z-index:2;display:flex;gap:4px;background:rgba(255,255,255,.72);border-radius:10px;padding:3px}
.gender-switch button{border:none;background:transparent;padding:5px 9px;border-radius:8px;font-size:11px;cursor:pointer;color:var(--sub);font-family:inherit}
.gender-switch button.on{background:var(--ink);color:#fff}
.cat-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.cat-pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;color:var(--ink);cursor:pointer;white-space:nowrap}
.cat-pill .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block;font-style:normal}
.cat-pill.miss{color:var(--sub);border-style:dashed}
.cat-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@keyframes stageFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.stage-flash{position:absolute;inset:0;background:rgba(255,255,255,.7);z-index:3;pointer-events:none;animation:stageFlash .6s ease forwards}
.look-hint{font-size:11px;color:var(--sub);text-align:center;margin-top:8px}
.look-sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.look-sec strong{font-size:13px}
.look-sec span{font-size:11px;color:var(--sub)}
.item-strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.item-strip::-webkit-scrollbar{display:none}
.d-item{flex:none;width:100px;border:1px solid var(--line);border-radius:16px;padding:9px;text-align:center;cursor:pointer;background:var(--card)}
.d-item .item-img{font-size:28px;border-radius:12px}
.d-item .nm{font-size:11px;margin-top:6px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-item .ct{font-size:10px;color:var(--accent);margin-top:3px}
.d-item.just{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.d-item.add{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:126px;color:var(--sub);font-size:11px;gap:6px}
.d-item.add .plus{font-size:22px;line-height:1}
.swap-note{margin-top:10px;font-size:11.5px;line-height:1.5;background:var(--accent-soft);color:#9A4028;border-radius:12px;padding:9px 12px}
.look-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.look-actions .act{flex:none}
.look-entry{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--app);border-radius:16px;padding:8px 12px 8px 8px;cursor:pointer}
.le-thumb{width:46px;height:62px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#F1EFEA,#E4E1DA);flex:none}
.le-thumb svg{display:block;width:100%;height:100%}
.le-txt{flex:1;min-width:0}
.le-txt strong{font-size:13px;display:block}
.le-txt span{font-size:11px;color:var(--sub);display:block;margin-top:2px}
.le-arrow{color:var(--sub);font-size:18px}
.disc{font-size:10px;color:var(--sub);line-height:1.5;margin-top:14px}
/* picker 面板 */
.mask.light{background:rgba(20,18,16,.14)}
.sheet.pick{max-height:46%}
.picker-head{display:flex;justify-content:space-between;align-items:center}
.picker-head strong{font-size:15px}
.picker-head .chip{padding:5px 12px;font-size:11px}
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pick-grid .gitem{padding:8px;border:1px solid var(--line);background:var(--card)}
.pick-grid .gitem.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pick-remove{width:100%;margin-top:12px;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:10px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit}
/* 模特叠色层 */
.tint-color{mix-blend-mode:color;opacity:.9;fill:var(--c);filter:blur(3px)}
.tint-mult{mix-blend-mode:multiply;opacity:var(--m,.4);fill:var(--c);filter:blur(3px)}
.tint-screen{mix-blend-mode:screen;opacity:var(--l,.3);fill:var(--c);filter:blur(3px)}
.tint-color.fine,.tint-mult.fine,.tint-screen.fine{filter:blur(1.3px)}
.tint-solid{fill:var(--c);opacity:.92}
</style>
</head>

/* ---------- 颜色 → 叠色策略 ---------- */
function tintColorFor(w){
  for(const c of (w.colors||[])){if(COLOR_HEX[c])return COLOR_HEX[c];}
  return COLOR_HEX[{white:'白',blue:'深蓝',gray:'灰',beige:'米',khaki:'卡其',black:'黑',brown:'棕',green:'绿'}[w.color]]||'#9C9994';
}
function hexLum(hex){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
function blendParams(hex){
  const L=hexLum(hex);
  const mult=Math.max(0,Math.min(.92,(.72-L)*2.2));
  const screen=Math.max(0,Math.min(.42,(L-.62)*1.9));
  return {mult,screen};
}

/* ---------- 模特 SVG ---------- */
function garmentSVG(slot,w){
  const g=GEO[modelGender];
  const hex=tintColorFor(w);
  const {mult,screen}=blendParams(hex);
  let core;
  if(slot==='accessory'){
    const a=g.accessory;
    return `<g class="tint-solid" style="--c:${hex}"><path d="${a.bag}"/><path d="${a.handle}" style="fill:none" stroke="${hex}" stroke-width="9" stroke-linecap="round"/></g>`;
  }else{
    core=(g[slot]||[]).map(d=>`<path d="${d}"/>`).join('');
  }
  const fine=slot==='footwear'?' fine':'';
  let out=`<g class="tint-color${fine}" style="--c:${hex}">${core}</g>`;
  if(mult>.02)out+=`<g class="tint-mult${fine}" style="--c:${hex};--m:${mult.toFixed(2)}">${core}</g>`;
  if(screen>.02)out+=`<g class="tint-screen${fine}" style="--c:${hex};--l:${screen.toFixed(2)}">${core}</g>`;
  return out;
}

function lookSVG(o,mini){
  const g=GEO[modelGender];
  const uid=++uidSeq;

  if(modelGender==='female'){
    const hair=g.hair.map(d=>`<path fill="#000" d="${d}"/>`).join('');
    defs=`<defs>

      <mask id="hair-${uid}"><rect x="0" y="0" width="1189" height="1982" fill="#fff"/><g filter="url(#soft-${uid})">${hair}</g></mask>
    </defs>`;
  }
  const order=['footwear','bottom','top','outer','accessory'];
  const layers=order.map(k=>{
    const wid=o.slots[k];if(!wid)return'';
    const w=item(wid);if(!w)return'';
    const mask=(modelGender==='female'&&(k==='top'||k==='outer'))?` mask="url(#hair-${uid})"`:'';
    return `<g${mask}>${garmentSVG(k,w)}</g>`;
  }).join('');
  return `<svg viewBox="${g.viewBox}" preserveAspectRatio="${mini?'xMidYMin slice':'xMidYMid meet'}">
    ${defs}
    <image href="${MODEL_IMG[modelGender]}" x="0" y="0" width="1189" height="1982" preserveAspectRatio="none"/>
    ${layers}
  </svg>`;
}

      <div class="gitem" onclick="openItem('${w.id}')">
        ${itemImg(w)}
        <div class="nm">${esc(w.name)}</div>
        <div class="ct">${CATS[w.cat]} · ${esc(w.colors.join('/'))}</div>
      </div>`).join('')}</div>`
    :`<div class="empty"><div class="big">🗂️</div>没有匹配的衣物<br><span class="sub">试试调整筛选条件，或添加一件新衣</span></div>`;
}
function refreshGrid(){$('#gridWrap').innerHTML=gridHtml(filtered());}

function filtered(){
  return WARDROBE.filter(w=>!w.archived &&
    (filters.cat==='全部'||w.cat===filters.cat) &&
    (!filters.season||w.season.includes(filters.season)) &&
    (!filters.q||w.name.includes(filters.q)));
}

function openItem(id){
  const w=item(id); if(!w)return;
  const aiMark=f=>`<span class="conf">AI 推断 · 置信度 ${Math.round(w.conf*100)}%</span>`;
  const row=(k,label,val,ai)=>`<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span class="sub">${label}</span><span>${esc(val)} ${ai?aiMark():''}</span></div>`;
  openSheet(`
    <div class="row" style="margin-bottom:14px"><div style="width:96px">${itemImg(w)}</div><div style="flex:1"><strong style="font-size:16px">${esc(w.name)}</strong><div class="sub" style="margin-top:4px">${CATS[w.cat]} · ${w.sub}</div><div class="sub">最近穿着：${w.lastWorn} · 共 ${w.worn} 次</div></div></div>
    ${row('color','主色',w.colors.join('/'))}
    ${row('pattern','图案',w.pattern,w.ai.includes('pattern'))}
    ${row('material','材质',w.material,w.ai.includes('material'))}
    ${row('style','风格标签',w.style.join(' / '))}
    ${row('formality','正式度',w.formality)}
    ${row('season','季节',w.season.join(' / '),w.ai.includes('season'))}
    ${row('temp','温度区间',w.temp,w.ai.includes('temp'))}
    ${row('occasion','适用场合',w.occasion.join(' / '))}
    <div class="row" style="gap:10px;margin-top:16px">
      <button class="btn btn-ghost" style="flex:1" onclick="openEdit('${w.id}')">✏️ 编辑属性</button>
      <button class="btn btn-ghost" style="flex:1" onclick="toggleFav('${w.id}')">${w.favorite?'★ 已收藏':'☆ 收藏'}</button>
    </div>
    <div class="row" style="gap:10px;margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="toggleArchive('${w.id}')">${w.archived?'恢复归档':'归档'}</button>
      <button class="btn" style="flex:1;background:var(--accent-soft);color:var(--accent)" onclick="removeItem('${w.id}')">删除衣物</button>
    </div>`);
}
function toggleFav(id){const w=item(id);w.favorite=!w.favorite;toast(w.favorite?'已收藏':'已取消收藏');openItem(id);render();}
function toggleArchive(id){const w=item(id);w.archived=!w.archived;toast(w.archived?'已归档，将不参与推荐':'已恢复');closeSheet();render();}
function removeItem(id){
  if(!confirm('删除后将同时清理关联搭配与穿着记录，且不可恢复，确认删除？'))return;
  WARDROBE=WARDROBE.filter(w=>w.id!==id);
  OUTFITS.forEach(o=>Object.keys(o.slots).forEach(k=>{if(o.slots[k]===id)o.slots[k]=null;}));
  toast('衣物及关联图片、搭配、记录已清理');closeSheet();render();
}

function openEdit(id){
  const w=item(id);
  openSheet(`
    <h3 style="margin-bottom:14px">编辑衣物属性</h3>
    <div class="field"><label>名称</label><input id="ed-name" value="${esc(w.name)}"></div>
    <div class="field"><label>分类</label><select id="ed-cat">${Object.keys(CATS).map(c=>`<option value="${c}" ${w.cat===c?'selected':''}>${CATS[c]}</option>`).join('')}</select></div>
    <div class="field"><label>主色</label><input id="ed-color" value="${esc(w.colors.join('/'))}"></div>
    <div class="field"><label>季节（逗号分隔）</label><input id="ed-season" value="${esc(w.season.join(','))}"></div>
    <div class="field"><label>备注</label><input id="ed-note" placeholder="补充说明（可选）"></div>
    <div class="sub" style="margin-bottom:12px">你修改的属性将优先于 AI 推断结果。</div>
    <div class="row"><button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">取消</button><button class="btn btn-accent" style="flex:1" onclick="saveEdit('${w.id}')">保存修改</button></div>`);
}
function saveEdit(id){
  const w=item(id);
  w.name=$('#ed-name').value.trim()||w.name;
  w.cat=$('#ed-cat').value;
  w.colors=$('#ed-color').value.split('/').filter(Boolean);
  w.season=$('#ed-season').value.split(',').map(s=>s.trim()).filter(Boolean);
  toast('属性已保存，已覆盖对应 AI 推断');closeSheet();render();
}

let addDraft=null, addStep=1;
function openAdd(){
  addDraft=null;addStep=1;renderAddStep();
}
function renderAddStep(){
  if(addStep===1){
    openSheet(`
      <h3 style="margin-bottom:6px">添加衣物</h3>
      <div class="sub" style="margin-bottom:18px">上传清晰平铺或上身图，AI 将自动识别属性；原图会被保留。</div>
      <div class="card" style="text-align:center;padding:30px 16px;cursor:pointer" onclick="addPick('camera')">
        <div style="font-size:38px">📷</div><strong style="display:block;margin-top:10px">拍摄照片</strong><span class="sub">对着衣物拍一张</span>
      </div>
      <div class="card" style="text-align:center;padding:30px 16px;margin-top:12px;cursor:pointer" onclick="addPick('album')">
        <div style="font-size:38px">🖼️</div><strong style="display:block;margin-top:10px">从相册选择</strong><span class="sub">选择已有衣物图片</span>
      </div>`);
  }else if(addStep===2){
    openSheet(`
      <h3 style="margin-bottom:6px">AI 识别中</h3>
      <div class="sub" style="margin-bottom:16px">图片已安全上传，正在解析结构化属性，请稍候…</div>
      <div class="skel" style="height:150px;margin-bottom:14px"></div>
      <div class="skel" style="height:20px;margin-bottom:10px;width:80%"></div>
      <div class="skel" style="height:20px;width:60%"></div>
      <div class="sub" style="margin-top:14px">任务状态：processing · 原图已保存，识别失败不会丢失衣物</div>
      <div class="row" style="gap:10px;margin-top:16px">
        <button class="btn btn-ghost" style="flex:1" onclick="addFail()">模拟识别失败</button>
        <button class="btn btn-ghost" style="flex:1" onclick="addStep=4;renderAddStep()">手动填写</button>
      </div>`);
    setTimeout(()=>{ if(addStep===2){addStep=3;renderAddStep();} },1600);
  }else if(addStep===3){
    if(!addDraft)addDraft={name:'未命名衣物',cat:'Tops',sub:'T-shirt',color:'white',colors:['白'],pattern:'纯色',material:'棉',style:['休闲'],formality:'休闲',season:['四季'],temp:'16-26°',occasion:['日常'],conf:.86,ai:['pattern','material','season'],emoji:'👕'};
    const d=addDraft;
    openSheet(`
      <h3 style="margin-bottom:6px">识别结果 · 请确认或修改</h3>
      <div class="sub" style="margin-bottom:14px">标记 AI 推断的字段存在置信度，可直接修改，你的修改优先。</div>
      <div class="row" style="gap:12px;margin-bottom:14px"><div style="width:84px">${itemImg(d)}</div><div class="sub">已生成统一尺寸展示图与缩略图；背景移除为可选能力。</div></div>
      <div class="field"><label>名称</label><input id="ad-name" value="${esc(d.name)}"></div>
      <div class="field"><label>分类 / 子类</label><select id="ad-cat">${Object.keys(CATS).map(c=>`<option value="${c}" ${d.cat===c?'selected':''}>${CATS[c]}</option>`).join('')}</select></div>
      <div class="field"><label>主色</label><input id="ad-color" value="${esc(d.colors.join('/'))}"></div>
      <div class="field"><label>图案 <span class="conf">AI · ${Math.round(d.conf*100)}%</span></label><input id="ad-pattern" value="${esc(d.pattern)}"></div>
      <div class="field"><label>季节 <span class="conf">AI 推断 · 可修改</span></label><input id="ad-season" value="${esc(d.season.join(','))}"></div>
      <div class="row" style="gap:10px">
        <button class="btn btn-ghost" style="flex:1" onclick="addStep=2;renderAddStep()">重新识别</button>
        <button class="btn btn-accent" style="flex:1" onclick="saveNew()">保存到衣柜</button>
      </div>`);
  }else if(addStep===4){
    openSheet(`
      <h3 style="margin-bottom:6px">识别失败 · 手动填写</h3>
      <div class="sub" style="margin-bottom:14px">原图与衣物记录已保留，你可以手动补全属性，也可稍后重试识别。</div>
      <div class="field"><label>名称</label><input id="ad-name" placeholder="给这件衣服起个名字"></div>
      <div class="field"><label>分类</label><select id="ad-cat">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>主色</label><input id="ad-color" placeholder="如：白 / 蓝 / 黑"></div>
      <div class="row" style="gap:10px">
        <button class="btn btn-ghost" style="flex:1" onclick="addStep=2;renderAddStep()">重试识别</button>
        <button class="btn btn-accent" style="flex:1" onclick="saveNew()">手动保存</button>
      </div>`);
  }
}
function addPick(src){addStep=2;renderAddStep();}
function addFail(){
  openSheet(`
    <h3 style="margin-bottom:6px">识别暂时失败</h3>
    <div class="card" style="margin:14px 0;border-left:3px solid var(--accent)">图片与记录均未丢失。可重试 AI 识别，或先手动填写属性保存。</div>
    <div class="row" style="gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="addStep=2;renderAddStep()">重试</button>
      <button class="btn btn-accent" style="flex:1" onclick="addStep=4;renderAddStep()">手动填写</button>
    </div>`);
}
function saveNew(){
  const name=($('#ad-name')&&$('#ad-name').value.trim())||'未命名衣物';
  const cat=($('#ad-cat')&&$('#ad-cat').value)||'Tops';
  const color=($('#ad-color')&&$('#ad-color').value.trim())||'白';
  const season=($('#ad-season')&&$('#ad-season').value)||'四季';
  const id='c'+Date.now();
  WARDROBE.push({id,name,cat,sub:cat,color:'white',colors:[color],pattern:'纯色',material:'—',style:['休闲'],formality:'休闲',season:season.split(',').map(s=>s.trim()),temp:'不限',occasion:['日常'],favorite:false,archived:false,worn:0,lastWorn:'未穿',emoji:'👕',conf:addStep===3?.86:0,ai:addStep===3?['pattern','material']:[]});
  closeSheet();toast('衣物已保存，可参与后续推荐');render();
}

/* ================= Stylist 对话顾问 ================= */
const QUICK=['生成今日搭配','换条裤子','更休闲一点','更正式一点','适合下雨吗','找件黑色外套','哪些衣服闲置'];
function renderStylist(v){
  v=v||$('#view');
  v.innerHTML=`
  <div class="page" style="padding-bottom:8px">
    <div class="row" style="justify-content:space-between"><div><div class="sub">AI Stylist</div><div class="pagetitle">穿搭顾问</div></div><div class="tag">上下文已保留</div></div>
    <div class="chat" id="chat" style="margin-top:14px">
      ${CHAT.map(m=>bubble(m)).join('')}
    </div>
    <div class="scroll-x" style="margin-bottom:10px">${QUICK.map(q=>`<div class="chip" onclick="quickAsk('${q}')">${q}</div>`).join('')}</div>
  </div>
  <div class="composer">
    <input id="chatInput" placeholder="问点什么，如：更暖一点 / 换双鞋" onkeydown="if(event.key==='Enter')sendChat()">
    <button class="btn btn-accent" onclick="sendChat()">发送</button>
  </div>`;
  const c=$('#chat');c.scrollTop=c.scrollHeight;
}
function bubble(m){
  let card='';
  if(m.outfitId){
    const o=OUTFITS.find(x=>x.id===m.outfitId);
    if(o){
      const SL={outer:'外套',top:'上衣',bottom:'下装',footwear:'鞋履',accessory:'配饰'};
      const slots=Object.keys(o.slots).filter(k=>o.slots[k]).map(k=>{const w=item(o.slots[k]);return w?`<div class="slot"><div class="label">${SL[k]||k}</div><div class="item-img" style="background:${GRAD[w.color]};font-size:22px">${w.emoji}</div><div class="nm">${esc(w.name)}</div></div>`:'';}).join('');
      card=`<div class="mini-outfit">${slots}</div><div class="mini-link" onclick="openLook('${o.id}','stylist')">👤 查看模特上身预览 ›</div><div class="sub" style="font-size:10px;margin-top:6px">基于你的真实衣物生成，未虚构单品</div>`;
    }
  }
  return `<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.text)}${card}</div>`;
}
function quickAsk(q){$('#chatInput').value=q;sendChat();}
function sendChat(){
  const inp=$('#chatInput');const text=inp.value.trim();if(!text)return;
  CHAT.push({role:'user',text});inp.value='';renderStylist();
  setTimeout(()=>{CHAT.push(genReply(text));renderStylist();},700);
}
function genReply(t){
  const cur=OUTFITS[0];
  if(/裤子|下装|裤/.test(t)){
    const cand=WARDROBE.filter(w=>w.cat==='Bottoms'&&w.id!==cur.slots.bottom);
    return {role:'ai',text:`好的，理解为只替换当前搭配的裤子，上衣和鞋子保持不变。同分类有 ${cand.length} 个候选，可进入模特预览后点「下装」直接试穿：`,outfitId:cur.id};
  }
  if(/休闲/.test(t))return {role:'ai',text:'已在当前方案基础上往休闲方向调整，尽量保留未涉及的单品；建议把乐福鞋换成小白鞋会更轻松。',outfitId:cur.id};
  if(/正式/.test(t))return {role:'ai',text:'已向更正式的方向调整，保留外套与上衣；西裤配乐福鞋更贴合商务场合。',outfitId:cur.id};
  if(/暖|冷|厚/.test(t))return {role:'ai',text:'当前 18°C 早晚偏凉，建议保留外套；如果想更暖，可把薄衬衫换成针织毛衣。',outfitId:cur.id};
  if(/雨|下雨/.test(t))return {role:'ai',text:'今天降水概率 20%，雨量不大，这套可正常穿；建议随身带伞，避免穿易受潮的麂皮鞋。'};
  if(/黑.*外套|外套.*黑/.test(t)){const c=WARDROBE.filter(w=>w.cat==='Outerwear'&&w.colors.includes('黑'));return {role:'ai',text:`你衣柜里的黑色外套：${c.length?c.map(w=>w.name).join('、'):'暂无黑色外套'}。`};}
  if(/闲置|没穿|利用率/.test(t))return {role:'ai',text:'近期穿着率较低的有：米色针织毛衣、黑色西装裤、棕色托特包。可以在 Today 方案里优先盘活它们。'};
  return {role:'ai',text:'结合今天 18°C、通勤场合和你的偏好，给出这套可直接穿的搭配，理由与天气适用性见方案卡片：',outfitId:cur.id};
}/* ================= Outfits 搭配与记录 ================= */
let outfitTab='推荐历史';
function renderOutfits(v){
  v=v||$('#view');
  const tabs=['收藏','推荐历史','穿着记录'];
  const list=OUTFITS.filter(o=>{
    if(outfitTab==='收藏')return o.feedback==='favorite';
    if(outfitTab==='穿着记录')return o.worn;
    return true;
  });
  v.innerHTML=`
  <div class="page">
    <div class="sub">搭配收藏 · 推荐历史 · 穿着记录</div>
    <div class="pagetitle">我的搭配</div>
    <div class="seg">${tabs.map(t=>`<button class="${outfitTab===t?'on':''}" onclick="outfitTab='${t}';renderOutfits($('#view'))">${t}</button>`).join('')}</div>
    <div class="sub" style="font-size:11px;margin-bottom:10px">点击任意搭配，直接进入模特上身预览</div>
    ${list.length?list.map(o=>{
      const status=o.worn?'已穿着':o.feedback==='favorite'?'已收藏':o.feedback==='like'?'喜欢':o.feedback==='dislike'?'不喜欢':'推荐';
      return `<div class="card timeline-item" style="cursor:pointer" onclick="openLook('${o.id}','outfits')">
        <div class="thumb model">${lookSVG(o,true)}</div>
        <div style="flex:1"><strong style="font-size:13.5px">${Object.values(o.slots).filter(Boolean).map(c=>item(c).name).join(' + ')}</strong>
        <div class="sub" style="margin-top:5px">${esc(o.context)}</div></div>
        <div class="tag" style="align-self:flex-start">${status}</div>
      </div>`;
    }).join('')
    :`<div class="empty"><div class="big">🗂️</div>${outfitTab==='穿着记录'?'还没有实际穿着记录<br><span class="sub">在 Today 方案里标记「已穿」后会显示在这里</span>':'暂无相关搭配'}</div>`}
  </div>`;
}

/* ================= Profile 画像与洞察 ================= */

  const cc={};WARDROBE.forEach(w=>{const c=w.colors[0];cc[c]=(cc[c]||0)+1;});

      <div class="sub" style="margin-top:10px">偏好来源：主动设置 · 喜欢/收藏 · 穿着与替换行为 · 对话指令（内部记录来源与置信度）</div>

    <div class="card" style="margin-top:16px">
      <div class="row" style="justify-content:space-between">

      </div>
      <div style="margin-top:16px">${top.map(w=>`

      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <strong>长期闲置</strong>

    </div>

    <div class="card" style="margin-top:16px">
      <strong>衣柜缺口分析</strong>
      <div class="insight-card"><h4>缺少可单穿的正式连衣裙</h4><p>当前衣橱以上下装为主，约会 / 活动场合缺少一件连衣裙。现有黑色西裤 + 浅蓝衬衫可在半正式场合部分替代；该项为可选补充，不构成强制购买。</p></div>
      <div class="insight-card"><h4>深冬厚外套不足</h4><p>现有最厚为风衣与牛仔外套，低于 5°C 时偏薄。米色毛衣可叠穿缓解；建议按所在城市冬季气候再决定是否补充。</p></div>
    </div>
  </div>`;
}
function addStyle(s){PROFILE.preferredStyles.push(s);toast(`已加入偏好：${s}`);render();}
function rmStyle(s){PROFILE.preferredStyles=PROFILE.preferredStyles.filter(x=>x!==s);render();}
function resetProfile(){if(confirm('重置后将清除你主动设置的偏好，仅保留可重新学习的行为信号？')){PROFILE.preferredStyles=[];toast('画像已重置');render();}}

/* ================= 初始化 ================= */
document.getElementById('clock').textContent=(()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');})();
render();
</script>
